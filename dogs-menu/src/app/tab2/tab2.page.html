<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title> Favourite </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Favourite</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>
    @for (fav of favBreeds(); track fav.id){
      <ion-item detail [routerLink]="['/favourites', fav.id]">
        <ion-thumbnail slot="start">
          <img src="{{fav.image}}" alt = "{{fav.name}}">
        </ion-thumbnail>
        <ion-label>
          <h2>{{ fav.name }}</h2>
          <p>{{ fav.temperament }}</p>
        </ion-label>
      </ion-item>
    } @empty {
      <div class="ion-text-center  ion-padding" >
        <ion-text>No favourites yet  </ion-text><ion-icon slot="icon-only" name="heart-outline" ></ion-icon>
      </div>
    }
  </ion-list>
</ion-content>
