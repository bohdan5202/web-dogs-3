<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Random breed </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Random breed</ion-title>
    </ion-toolbar>
  </ion-header>

  @if (currentBreed(); as b ){
    <div class="ion-padding">
    <ion-card>
      <img src="{{b.image}}" alt="{{b.name}}">
       <ion-card-header>
       <ion-card-subtitle>{{b.temperament}}</ion-card-subtitle>
       <ion-card-title>{{b.name}}</ion-card-title>
       <ion-card-subtitle>Size: {{b.size}}</ion-card-subtitle>
      </ion-card-header>
     <ion-card-content>
       {{b.description}}
      </ion-card-content>
    </ion-card>
    </div>
  }

</ion-content>
<ion-footer>
  <ion-toolbar>
    <ion-button class="ion-margin-horizontal" expand="block" (click)="next()">Next breed</ion-button>
  </ion-toolbar >
</ion-footer>
